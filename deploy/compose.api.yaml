# Combine with the VPS's existing compose.yaml, using project name uat.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - postgres.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    image: progressrooms-api-uat:${API_IMAGE_TAG:?API_IMAGE_TAG must be set}
    restart: unless-stopped
    init: true
    env_file:
      - api.env
    ports:
      - "127.0.0.1:8100:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - api_uploads:/app/uploads
      - api_websites:/app/generated-websites
      - api_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    mem_limit: 1g
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  zoom-maintenance:
    image: progressrooms-api-uat:${API_IMAGE_TAG:?API_IMAGE_TAG must be set}
    restart: unless-stopped
    init: true
    env_file:
      - api.env
    command: ["python", "-m", "app.modules.zoom.maintenance"]
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 256m
    cpus: 0.25
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  api_uploads:
  api_websites:
  api_data:
